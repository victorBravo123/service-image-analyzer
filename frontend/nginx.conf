server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Frontend and backend share one origin, so the browser needs no CORS.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 6m; # slightly above the app's 5 MB so the API returns its own 413
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
