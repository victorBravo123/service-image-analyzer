services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-5}
      # Defaults to the demo annotator, so the stack runs with no setup.
      # Set ANNOTATOR=imagga plus credentials in a root .env to use the real provider.
      ANNOTATOR: ${ANNOTATOR:-fake}
      IMAGGA_API_KEY: ${IMAGGA_API_KEY:-}
      IMAGGA_API_SECRET: ${IMAGGA_API_SECRET:-}
      IMAGGA_TIMEOUT_MS: ${IMAGGA_TIMEOUT_MS:-30000}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
